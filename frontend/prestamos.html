<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioUni — Préstamos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div class="app-layout">
  <div id="sidebarContainer"></div>

  <div class="main-wrapper">
    <div id="topbarContainer"></div>

    <main class="main-content">

      <!-- Header -->
      <div class="page-header d-flex align-items-center justify-content-between">
        <div>
          <h1 class="page-title" id="prestamosTitle">Mis Préstamos</h1>
          <p class="page-subtitle" id="prestamosSubtitle">Gestiona tus libros prestados</p>
        </div>
        <a href="catalogo.html" class="btn btn-primary btn-sm" id="btnSolicitarPrestamo">
          <i class="fas fa-plus me-1"></i>Solicitar Préstamo
        </a>
      </div>

      <!-- Stats rápidos -->
      <div class="row g-3 mb-4" id="prestamoStats">
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-icon si-blue"><i class="fas fa-book-reader"></i></div>
            <div class="stat-info">
              <div class="stat-label">Activos</div>
              <div class="stat-value" id="cntActivos">—</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-icon si-green"><i class="fas fa-check-circle"></i></div>
            <div class="stat-info">
              <div class="stat-label">Devueltos</div>
              <div class="stat-value" id="cntDevueltos">—</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-icon si-amber"><i class="fas fa-clock"></i></div>
            <div class="stat-info">
              <div class="stat-label">Por vencer</div>
              <div class="stat-value" id="cntPorVencer">—</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-icon si-red"><i class="fas fa-exclamation-circle"></i></div>
            <div class="stat-info">
              <div class="stat-label">Vencidos</div>
              <div class="stat-value" id="cntVencidos">—</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" id="prestamoTabs">
        <li class="nav-item">
          <a class="nav-link active" href="#" id="tabActivos" onclick="filtrarEstado('activo');return false;">
            Activos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" id="tabDevueltos" onclick="filtrarEstado('devuelto');return false;">
            Devueltos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" id="tabTodos" onclick="filtrarEstado('todos');return false;">
            Todos
          </a>
        </li>
        <!-- Solo bibliotecario -->
        <li class="nav-item d-none" id="tabVencerItem">
          <a class="nav-link" href="#" id="tabVencer" onclick="filtrarEstado('por_vencer');return false;">
            <i class="fas fa-bell text-danger me-1"></i>Por Vencer (Sistema)
          </a>
        </li>
      </ul>

      <!-- Tabla de préstamos -->
      <div class="content-card">
        <div class="content-card-header">
          <span class="content-card-title" id="tablaTitle">Préstamos Activos</span>
          <span class="badge bg-secondary rounded-pill" id="contadorBadge">0</span>
        </div>
        <div id="prestamosTableContainer">
          <div class="loading-box">
            <div class="spinner-border spinner-border-sm text-primary"></div> Cargando...
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/prestamos.js"></script>
</body>
</html>
